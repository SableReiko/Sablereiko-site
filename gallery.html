<style>
  /* ── gallery-specific ── */
  .page-head{padding:clamp(2.5rem,7vh,4.5rem) 0 clamp(1rem,3vh,1.5rem)}
  .page-head h1{font-size:clamp(2.6rem,7vw,4.2rem);margin-top:.5rem}

  .register-head{
    margin:clamp(2.5rem,6vh,4rem) 0 .4rem;
    display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  }
  .register-head h2{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:.02em;
  }

  .tier-head{
    margin:2.2rem 0 1rem;
    display:flex;align-items:baseline;gap:1rem;
    border-top:1px solid var(--hairline);
    padding-top:1.1rem;
  }
  .tier-head h3{
    font-family:var(--mono);font-weight:500;font-size:.78rem;
    letter-spacing:.22em;text-transform:uppercase;color:var(--paper);
  }
  .tier-head .count{
    font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;
    color:var(--smoke);
  }

  /* hull grid: wide plates, uniform */
  .grid-hulls{
    display:grid;grid-template-columns:repeat(2,1fr);gap:1.4rem;
  }
  @media (max-width:720px){.grid-hulls{grid-template-columns:1fr}}

  /* personnel: masonry columns so mixed aspects never crop */
  .grid-personnel{columns:3;column-gap:1.4rem}
  @media (max-width:980px){.grid-personnel{columns:2}}
  @media (max-width:560px){.grid-personnel{columns:1}}
  .grid-personnel .plate{break-inside:avoid;margin-bottom:1.4rem}

  /* plate card */
  .plate{background:var(--ash);border:1px solid var(--hairline)}
  .plate a{display:block;border-bottom:none}
  .plate img{width:100%;height:auto;display:block}
  .grid-hulls .plate img{aspect-ratio:16/9;object-fit:cover}
  .plate .cap{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .8rem;
    padding:.7rem .85rem .75rem;
    border-top:1px solid var(--hairline);
  }
  .plate .cap .name{
    font-family:var(--display);font-weight:600;text-transform:uppercase;
    font-size:1.02rem;letter-spacing:.03em;color:var(--paper);
  }
  .plate .cap .meta{
    font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--smoke);
    flex-basis:100%;
  }
  .plate a:hover .name{color:var(--violet)}
  .plate a:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

  /* the missing record */
  .plate.missing{
    display:flex;flex-direction:column;justify-content:center;
    min-height:9rem;padding:1.2rem .85rem;
  }
  .plate.missing .name{color:var(--steel)}
  .plate.missing .meta{color:var(--steel)}

  /* ── the seventh berth ──
     Looks like every other lost record. Press and hold it. */
  .plate.trap{
    position:relative;overflow:hidden;cursor:default;
    -webkit-user-select:none;user-select:none;
    transition:border-color .3s ease;
  }
  .plate.trap:hover{border-color:var(--steel)}
  .plate.trap:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  .plate.trap::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;width:0;
    background:var(--violet);transition:width .2s ease-out;
  }
  .plate.trap.arming::after{width:100%;transition:width 1500ms linear}
  .plate.trap.found{border-color:var(--violet);cursor:pointer}
  .plate.trap.found::after{width:100%;transition:none}
  .plate.trap.found .name{color:var(--paper)}
  .plate.trap.found .meta{color:var(--violet)}

  /* ── the bay ── */
  body.bay-open{overflow:hidden}
  #bay[hidden]{display:none}
  #bay{
    position:fixed;inset:0;z-index:90;
    display:flex;flex-direction:column;background:#05080b;
  }
  #bay .bay-bar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:1rem;padding:.55rem .9rem;border-bottom:1px solid var(--hairline);
    font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--smoke);
  }
  #bay .bay-bar .id{color:var(--violet)}
  #bay .bay-bar .note{display:none}
  @media (min-width:720px){#bay .bay-bar .note{display:inline}}
  #bay .bay-close{
    font:inherit;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
    color:var(--paper);background:transparent;
    border:1px solid var(--hairline);padding:.42rem .75rem;
  }
  #bay .bay-close:hover{border-color:var(--violet);color:var(--violet)}
  #bay .bay-close:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  #bay iframe{flex:1 1 auto;width:100%;border:0;display:block;background:#05080b}
  @media (prefers-reduced-motion:reduce){
    .plate.trap.arming::after{transition:width 1500ms linear}
  }

<script>
/* ═══ THE MANIFEST ═════════════════════════════════════════
   Everything on this page renders from these arrays.
   To retitle, re-tier, or annotate a plate: edit it here.
   To add a plate: drop the image in images/hulls or
   images/personnel and add one entry. Nothing else changes.
   file:  filename inside the folder (exact, lowercase)
   name:  display title (any punctuation welcome)
   meta:  mono caption line — class, role, origin, status
   ═══════════════════════════════════════════════════════ */

const HULL_TIERS = [

    { file:"purchased-fighters.jpg",       name:"Purchased Fighters",       meta:"Origin: outside acquisition" },
    { file:"the-obsessive-courier.jpg",    name:"The Obsessive Courier",    meta:"Class: courier · high hours" },
    { file:"the-surplus-that-isnt.jpg",    name:"The Surplus That Isn't",   meta:"Ex-service · decommissioned on paper" },
  ]},
  { tier:"Restricted Register", plates:[
    { file:"dusk-and-dawn.jpg",            name:"Dusk & Dawn",              meta:"Paired hulls · access controlled" },
    { file:"stealth-dropship.jpg",         name:"Stealth Dropship",         meta:"Sig. mask 92.7% · thermal cold" },
    { file:"the-whisper.jpg",              name:"The Whisper",              meta:"Faceted hull · anomalous reflect" },
    { file:"sable-edit-whisper.jpg",       name:"The Whisper — Sable Edit", meta:"Refit · registry copy" },
    { file:"vael-pattern-interceptors.jpg",name:"Vael-Pattern Interceptors",meta:"Maker-pattern · flight of three" },
    { file:"vaeloth-sirrethaan-maker-fighters.jpg", name:"Vaeloth-Sirreth'aan Maker Fighters", meta:"Maker craft · handle with ceremony" },
  ]},
  { tier:"Unclassified Hulls", plates:[
    { file:"the-old-one.jpg",                       name:"The Old One",        meta:"Origin: unknown · age: considerable" },
    { file:"unclassified-1-the-older-one.jpg",      name:"№1 — The Older One", meta:"Origin: unknown · inscribed" },
    { file:"unclassified-2-the-later-one.jpg",      name:"№2 — The Later One", meta:"Origin: unknown · powered" },
    { file:"unclassified-3-the-hybrid.jpg",         name:"№3 — The Hybrid",    meta:"Origin: mixed · seam visible" },
    { file:"unclassified-4-the-coral-hull.jpg",     name:"№4 — The Coral Hull",meta:"Origin: unknown · grown, not built" },
    { file:"unclassified-5-the-crystalline.jpg",    name:"№5 — The Crystalline",meta:"Origin: unknown · refracts" },
    { file:"unclassified-6-the-drowned.jpg",        name:"№6 — The Drowned",   meta:"Origin: unknown · recovered" },
    { missing:true, trap:true,                       name:"№7 —",              meta:"Record missing" },

const PERSONNEL_STRATA = [

/* ═══ render ═══════════════════════════════════════════ */

function plateCard(folder, p){
  if (p.missing){
    const attrs = p.trap
      ? ' id="sr-g-07" tabindex="0" role="button"'
        + ' aria-label="Unrecovered record. Press and hold to attempt recovery."'
      : '';
    return '<div class="plate missing' + (p.trap ? ' trap' : '') + '"' + attrs + '>'
      + '<div class="cap">'
      + '<span class="name">' + p.name + '</span>'
      + '<span class="meta">' + p.meta + '</span>'
      + '</div></div>';
  }
  const src = "images/" + folder + "/" + p.file;
  return '<figure class="plate">'
    + '<a href="' + src + '" target="_blank" rel="noopener">'
    + '<img src="' + src + '" alt="' + p.name.replace(/"/g,"&quot;") + '" loading="lazy" '
    + 'onerror="this.closest(\'figure\').classList.add(\'missing\');this.remove();">'
    + '<figcaption class="cap">'
    + '<span class="name">' + p.name + '</span>'
    + '<span class="meta">' + p.meta + '</span>'
    + '</figcaption></a></figure>';
}

function renderRegister(mountId, folder, tiers, gridClass){
  const mount = document.getElementById(mountId);
  let html = "";
  for (const t of tiers){
    const n = t.plates.length;
    html += '<div class="tier-head"><h3>' + t.tier + '</h3>'
         +  '<span class="count">' + n + (n === 1 ? " plate" : " plates") + '</span></div>'
         +  '<div class="' + gridClass + '">'
         +  t.plates.map(p => plateCard(folder, p)).join("")
         +  '</div>';
  }
  mount.innerHTML = html;
}

renderRegister("hulls", "hulls", HULL_TIERS, "grid-hulls");
renderRegister("personnel", "personnel", PERSONNEL_STRATA, "grid-personnel");

/* ═══ the seventh berth ════════════════════════════════════
   №7 isn't missing. It's parked. Press and hold the plate.
   HULL_FILE is the only line to change if you rename it.
   ═══════════════════════════════════════════════════════ */

const HULL_FILE = "flight-sim.html";
const HOLD_MS   = 1500;

(function seventhBerth(){
  const plate = document.getElementById("sr-g-07");
  const bay   = document.getElementById("bay");
  const frame = document.getElementById("bay-frame");
  const shut  = document.getElementById("bay-close");
  if (!plate || !bay || !frame) return;

  const nameEl = plate.querySelector(".name");
  const metaEl = plate.querySelector(".meta");
  let timer = null, found = false, loaded = false, returnTo = null;

  function disarm(){
    clearTimeout(timer); timer = null;
    plate.classList.remove("arming");
  }

  function arm(ev){
    if (found){ open(); return; }
    if (timer) return;
    ev.preventDefault();
    plate.classList.add("arming");
    timer = setTimeout(recover, HOLD_MS);
  }

  function recover(){
    disarm();
    found = true;
    plate.classList.add("found");
    nameEl.textContent = "№7 — Kestrel A-2";
    metaEl.textContent = "Record recovered · airworthy";
    plate.setAttribute("aria-label", "Record recovered: Kestrel A-2. Activate to open the berth.");
    setTimeout(open, 650);
  }

  function open(){
    returnTo = document.activeElement;
    if (!loaded){ frame.src = HULL_FILE; loaded = true; }
    bay.hidden = false;
    document.body.classList.add("bay-open");
    setTimeout(function(){ try{ frame.focus(); }catch(e){} }, 60);
  }

  function close(){
    bay.hidden = true;
    document.body.classList.remove("bay-open");
    // unload so the sim stops burning frames and audio behind the page
    frame.src = "about:blank"; loaded = false;
    if (returnTo && returnTo.focus) returnTo.focus();
  }

  plate.addEventListener("pointerdown", arm);
  plate.addEventListener("pointerup", disarm);
  plate.addEventListener("pointerleave", disarm);
  plate.addEventListener("pointercancel", disarm);
  plate.addEventListener("contextmenu", function(e){ if(!found) e.preventDefault(); });

  plate.addEventListener("keydown", function(ev){
    if (ev.key !== "Enter" && ev.key !== " ") return;
    if (ev.repeat) return;
    arm(ev);
  });
  plate.addEventListener("keyup", function(ev){
    if (ev.key === "Enter" || ev.key === " ") disarm();
  });
  plate.addEventListener("blur", disarm);

  shut.addEventListener("click", close);
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && !bay.hidden) close();
  });
})();
</script>
